[providers.chatgpt]
base_url = "https://chatgpt.com/backend-api/codex"
auth = "passthrough"
catalog = { path = "/models", format = "codex" }

[providers.openai]
base_url = "https://api.openai.com/v1"
auth = "passthrough"

[providers.sglang]
base_url = "http://localhost:30000/v1"
auth = "none"
catalog = { path = "/models", format = "openai" }
discovery_urls = [
  "http://localhost:30000/model_info",
  "http://localhost:30000/server_info",
  "http://localhost:30000/openapi.json",
]

[providers.sglang.capabilities]
access_programs = false
history_notes = false

[providers.sglang.models."RadixArk/Qwen3.8-Flash-Next-NVFP4"]
extends = { provider = "chatgpt", model = "gpt-6-luna" }
name = "Qwen3.8-Flash-Next"
description = "Zero-cost lightweight model with modest capabilities"
reasoning_level = "xhigh"
reasoning_levels = [
  { level = "low", description = "Fast responses with lighter reasoning" },
  { level = "medium", description = "Balances speed and reasoning depth for everyday tasks" },
  { level = "xhigh", description = "Extra high reasoning depth for complex problems" },
]

[clients.codex]
provider = { subscription = "chatgpt", api_key = "openai" }
format = "codex"

[model_overrides]
"gpt-reserve" = ""
"gpt-5.6-*" = "gpt-6-*"
"gpt-6-astra" = "gpt-6.2-astra"
"gpt-{6,6.1}-sol" = "gpt-6.2-sol"

[[routes]]
method = "GET"
path = "/models"
action = "catalog"

[[routes]]
path_prefix = "/responses"
action = "model"

[[routes]]
action = "forward"
