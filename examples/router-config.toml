[providers.chatgpt]
base_url = "https://chatgpt.com/backend-api/codex"
auth = "passthrough"
hidden_models = ["gpt-{reserve,5.6-*,6-sol}"]

[providers.sglang]
base_url = "http://localhost:30000/v1"
auth = "none"
catalog = { path = "/models", format = "openai" }
discovery_urls = [
	"http://localhost:30000/model_info",
	"http://localhost:30000/server_info",
	"http://localhost:30000/openapi.json",
]

[providers.sglang.models."nvidia/Qwen3.8-Flash-Next-NVFP4"]
extends = { provider = "chatgpt", model = "gpt-6-luna" }
name = "Qwen-3.8 Flash Next"
description = "Zero-cost lightweight model with modest capabilities"
reasoning_levels = [
	{ level = "low", description = "Fast responses with lighter reasoning" },
	{ level = "medium", description = "Balances speed and reasoning depth for everyday tasks" },
	{ level = "xhigh", description = "Maximum reasoning depth for complex problems" },
]

[[routes]]
method = "GET"
path = "/models"
action = "catalog"
provider = "chatgpt"
format = "codex"

[[routes]]
path_prefix = "/responses"
action = "model"
provider = "chatgpt"
